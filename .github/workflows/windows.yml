name: Windows build and integration
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts,tests -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors){throw "$($_.FullName): $($errors -join '; ')"}
          }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            squashfs-tools
            curl
            unzip
      - name: Build native reader and collect Linux tool ports
        shell: msys2 {0}
        run: bash scripts/build-native.sh
      - name: Install WinFsp SDK and driver
        shell: pwsh
        run: ./scripts/install-winfsp.ps1
      - name: Publish self-contained applications
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Run codec, filesystem and random-access integration tests
        shell: pwsh
        run: |
          dotnet publish tests/Integration/Integration.csproj -c Release -r win-x64 --self-contained true -o artifacts/test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item artifacts/native/* artifacts/test -Recurse -Force
          & ./artifacts/test/Integration.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: English WinUI end-to-end automation
        shell: powershell
        run: ./tests/ui.ps1 -AppDirectory (Resolve-Path artifacts/dist).Path -Language en-US
      - name: Simplified Chinese WinUI end-to-end automation
        shell: powershell
        run: ./tests/ui.ps1 -AppDirectory (Resolve-Path artifacts/dist).Path -Language zh-CN
      - name: Localized command-line output
        shell: pwsh
        run: |
          $cli=Resolve-Path artifacts/dist/winsqfs.exe
          $english=& $cli --lang en-US unc-status
          if ($LASTEXITCODE -or $english -ne 'Stopped') { throw "Unexpected English CLI output: $english" }
          $chinese=& $cli --lang zh-CN unc-status
          if ($LASTEXITCODE -or $chinese -ne '已停止') { throw "Unexpected Chinese CLI output: $chinese" }
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WinSquashfs-UI-screenshots
          path: artifacts/screenshots/
          if-no-files-found: warn
      - name: Test packaged application and cross-language UNC communication
        timeout-minutes: 4
        shell: pwsh
        run: |
          $version=([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          ./tests/distribution.ps1 -AppDirectory (Resolve-Path artifacts/dist).Path -Version $version
      - name: Build NSIS installer
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $nsis=Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'NSIS\makensis.exe'
          $version=([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          $runtime=([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.WinFspRuntimeVersion
          & $nsis "/DPRODUCT_VERSION=$version" "/DWINFSP_MIN_VERSION=$runtime.0" installer/WinSquashfs.nsi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify installation, registry and uninstallation
        timeout-minutes: 8
        shell: pwsh
        run: |
          $version=([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          $setup=(Resolve-Path artifacts/WinSquashfs-Setup-x64.exe).Path
          if ([Diagnostics.FileVersionInfo]::GetVersionInfo($setup).FileVersion -ne "$version") { throw 'Installer version mismatch' }
          $p=Start-Process $setup -ArgumentList @('/S','/LANG=1033') -Wait -PassThru
          if ($p.ExitCode) { throw "Installer exit $($p.ExitCode)" }
          $install=Join-Path $env:ProgramFiles 'WinSquashfs'
          if (!(Test-Path "$install/app/WinSquashfs.exe")) { throw 'Missing GUI' }
          if (!(Test-Path "$install/app/tools/unsquashfs.exe")) { throw 'Missing unsquashfs' }
          if (!(Test-Path "$install/app/WinSquashfs.Unc.exe")) { throw 'Missing UNC background application' }
          if (!(Test-Path 'HKLM:\Software\Classes\SystemFileAssociations\.squashfs\shell\WinSquashfs.Unc\command')) { throw 'Missing UNC verb' }
          if (!(Test-Path 'HKLM:\Software\Classes\WinSquashfs.Image\shell\open\command')) { throw 'Missing file association' }
          if (!(Test-Path 'HKLM:\Software\Classes\SystemFileAssociations\.squashfs\shell\WinSquashfs.Mount\command')) { throw 'Missing mount verb' }
          if (!(Test-Path 'HKLM:\Software\Classes\Directory\shell\WinSquashfs.Pack\command')) { throw 'Missing pack verb' }
          $registered=(Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\WinSquashfs').DisplayVersion
          if ($registered -ne $version) { throw "Installed version mismatch: $registered" }
          $key=Get-Item 'HKLM:\Software\Classes\SystemFileAssociations\.squashfs\shell\WinSquashfs.Browse'
          if ($key.GetValue('') -ne 'Browse with WinSquashfs') { throw 'English Explorer verb was not registered' }
          ./tests/distribution.ps1 -AppDirectory "$install/app" -Version $version
          $p=Start-Process "$install/Uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode) { throw "Uninstaller exit $($p.ExitCode)" }
          if (Test-Path 'HKLM:\Software\Classes\WinSquashfs.Image') { throw 'Association not removed' }
          $p=Start-Process (Resolve-Path artifacts/WinSquashfs-Setup-x64.exe) -ArgumentList @('/S','/LANG=2052') -Wait -PassThru
          if ($p.ExitCode) { throw "Chinese installer exit $($p.ExitCode)" }
          $key=Get-Item 'HKLM:\Software\Classes\SystemFileAssociations\.squashfs\shell\WinSquashfs.Browse'
          if ($key.GetValue('') -ne '使用 WinSquashfs 浏览') { throw 'Chinese Explorer verb was not registered' }
          $language=(Get-ItemProperty 'HKLM:\Software\WinSquashfs').InstallerLanguage
          if ($language -ne 2052) { throw 'Chinese installer language was not saved' }
          $registered=(Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\WinSquashfs').DisplayVersion
          if ($registered -ne $version) { throw "Installed version mismatch: $registered" }
          $p=Start-Process "$install/Uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -or (Test-Path 'HKLM:\Software\Classes\WinSquashfs.Image')) { throw 'Chinese uninstallation failed' }
      - name: Upload installer and portable distribution
        uses: actions/upload-artifact@v4
        with:
          name: WinSquashfs-windows-x64
          path: |
            artifacts/WinSquashfs-Setup-x64.exe
            artifacts/dist/
          if-no-files-found: error
  installer-compatibility:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [clean, upgrade]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WinSquashfs-windows-x64
          path: output
      - name: Test runtime compatibility and actual installed mount
        shell: pwsh
        timeout-minutes: 10
        run: |
          ./tests/runtime-install.ps1 -Scenario ${{ matrix.scenario }} -Distribution output/dist -Setup output/WinSquashfs-Setup-x64.exe
      - name: Test installed WinUI
        shell: powershell
        run: |
          $language=if ('${{ matrix.scenario }}' -eq 'upgrade') {'zh-CN'} else {'en-US'}
          ./tests/ui.ps1 -AppDirectory "$env:ProgramFiles\WinSquashfs\app" -Language $language
      - name: Verify uninstallation
        shell: pwsh
        run: |
          $p=Start-Process "$env:ProgramFiles\WinSquashfs\Uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          if($p.ExitCode){throw "Uninstall returned $($p.ExitCode)"}
          if(Test-Path 'HKLM:\Software\Classes\Drive\shellex\ContextMenuHandlers\WinSquashfs.Eject'){throw 'Eject menu was not removed'}
          if(Test-Path 'HKLM:\Software\Classes\CLSID\{9B20352F-1BC4-48E6-AE3B-146F32657DA9}'){throw 'Eject COM class was not removed'}
          if(Test-Path 'HKLM:\Software\Classes\WinSquashfs.Image'){throw 'File association was not removed'}
      - name: Upload installed application screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WinSquashfs-installed-${{ matrix.scenario }}
          path: |
            artifacts/screenshots/
            ${{ runner.temp }}/WinSquashfs-WinFsp-install.log
          if-no-files-found: warn
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [build, installer-compatibility]
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WinSquashfs-windows-x64
          path: output
      - name: Package, verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh
