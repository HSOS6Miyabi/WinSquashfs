name: Native Windows production decoders
on:
  push:
    branches: ['refactor/native-cpp-validation', 'refactor/native-cpp']
    paths:
      - 'scripts/build-alternate-readers.sh'
      - 'native/cpp/**'
      - 'installer/**'
      - 'tests/**'
      - 'Directory.Build.props'
      - 'scripts/install-winfsp.ps1'
      - '.github/workflows/windows-native-decoders.yml'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  native-readers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x86
            msystem: MINGW32
            compiler: gcc
            extra: ''
          - runner: windows-11-arm
            arch: arm64
            msystem: CLANGARM64
            compiler: clang
            extra: 'lzo2:p libdeflate:p'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 160
    steps:
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          suppress-deprecation-warnings: msystem-mingw32
          install: git curl autoconf automake libtool make pkgconf python
          pacboy: >-
            ${{ matrix.compiler }}:p
            binutils:p
            pkgconf:p
            zlib:p
            xz:p
            lz4:p
            zstd:p
            libtre:p
            ${{ matrix.extra }}
            gettext:p
            libiconv:p
            libwinpthread:p
      - name: Install signed archived x86 compression libraries
        if: matrix.arch == 'x86'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          sed -E '/^[[:space:]#]*LocalFileSigLevel[[:space:]]*=/d; /^\[options\][[:space:]]*$/a LocalFileSigLevel = Required TrustedOnly' /etc/pacman.conf > pacman.conf
          grep -Fx "LocalFileSigLevel = Required TrustedOnly" pacman.conf
          for package in mingw-w64-i686-lzo2-2.10-3-any.pkg.tar.zst mingw-w64-i686-libdeflate-1.26-1-any.pkg.tar.zst; do
            curl --fail --location --retry 3 -O "https://repo.msys2.org/mingw/mingw32/$package"
            curl --fail --location --retry 3 -O "https://repo.msys2.org/mingw/mingw32/$package.sig"
            pacman --config "$PWD/pacman.conf" -U --noconfirm "$package"
          done
      - name: Build native SquashFS and EROFS libraries
        shell: msys2 {0}
        run: bash scripts/build-alternate-readers.sh ${{ matrix.arch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install WinFsp
        shell: pwsh
        run: ./scripts/install-winfsp.ps1 -Architecture ${{ matrix.arch }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - uses: actions/cache/restore@v4
        id: dwarfs-cache
        with:
          path: |
            .deps/${{ matrix.arch }}/dwarfs-install
            .deps/${{ matrix.arch }}/vcpkg-installed
          key: archivefs-native-dwarfs-v0.15.10-${{ matrix.arch }}-v2
      - uses: actions/cache/restore@v4
        id: dwarfs-ports
        if: steps.dwarfs-cache.outputs.cache-hit != 'true'
        with:
          path: .deps/${{ matrix.arch }}/vcpkg-installed
          key: archivefs-native-dwarfs-ports-v0.15.10-${{ matrix.arch }}-v1
      - name: Configure official DwarFS dependencies
        if: steps.dwarfs-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./native/cpp/scripts/build.ps1 -Stage ConfigureDependencies -Architecture ${{ matrix.arch }}
      - uses: actions/cache/save@v4
        if: steps.dwarfs-cache.outputs.cache-hit != 'true' && steps.dwarfs-ports.outputs.cache-hit != 'true'
        with:
          path: .deps/${{ matrix.arch }}/vcpkg-installed
          key: ${{ steps.dwarfs-ports.outputs.cache-primary-key }}
      - name: Build official DwarFS library and tools
        shell: pwsh
        run: ./native/cpp/scripts/build.ps1 -Stage Dependencies -Architecture ${{ matrix.arch }}
      - uses: actions/cache/save@v4
        if: steps.dwarfs-cache.outputs.cache-hit != 'true'
        with:
          path: |
            .deps/${{ matrix.arch }}/dwarfs-install
            .deps/${{ matrix.arch }}/vcpkg-installed
          key: ${{ steps.dwarfs-cache.outputs.cache-primary-key }}
      - name: Build production core with official DwarFS
        shell: pwsh
        run: |
          $arch='${{ matrix.arch }}'
          $deps=Join-Path $PWD ".deps/$arch"
          $ports=Join-Path $deps 'vcpkg-installed'
          $prefix=Join-Path $deps 'dwarfs-install'
          $out=Join-Path $PWD "artifacts/readers-$arch"
          $vcpkg=$env:VCPKG_INSTALLATION_ROOT
          if(!$vcpkg){$vcpkg=$env:VCPKG_ROOT}
          $triplet="$arch-windows-static-md"
          & "$vcpkg/vcpkg.exe" install 'libarchive[bzip2,crypto,lz4,lzma,zstd]' nlohmann-json --classic "--triplet=$triplet" "--x-install-root=$ports"
          if($LASTEXITCODE){exit $LASTEXITCODE}
          $env:PKG_CONFIG_PATH="$ports/$triplet/lib/pkgconfig"
          $env:PATH="$ports/$triplet/tools/pkgconf;$env:PATH"
          cmake -S native/cpp -B build/production -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=$vcpkg/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_TARGET_TRIPLET=$triplet" "-DVCPKG_INSTALLED_DIR=$ports" "-DCMAKE_PREFIX_PATH=$prefix" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DARCHIVEFS_WITH_DWARFS=ON -DARCHIVEFS_BUILD_SHELL=ON -DBUILD_TESTING=OFF -DVCPKG_MANIFEST_MODE=OFF
          if($LASTEXITCODE){exit $LASTEXITCODE}
          cmake --build build/production --parallel 2
          if($LASTEXITCODE){exit $LASTEXITCODE}
          Copy-Item build/production/archivefs-read.exe "$out/archivefs.exe"
          Copy-Item build/production/archivefs_core.dll,build/production/WinArchiveFSPro.Unc.exe $out
          Copy-Item "$prefix/bin/mkdwarfs.exe","$prefix/bin/dwarfsck.exe" "$out/tools"
          Copy-Item "$prefix/licenses/dwarfs.txt" "$out/licenses"
          $crt=Get-ChildItem (Join-Path $env:VCToolsRedistDir $arch) -Directory | Where-Object Name -Match '^Microsoft\.VC[0-9]+\.CRT$' | Select-Object -First 1
          if(!$crt){throw "Missing runtime for $arch"}
          $machine=@{x86=0x014c;arm64=0xaa64}[$arch]
          Get-ChildItem $crt.FullName -Filter '*.dll' | ForEach-Object {
            $stream=[IO.File]::OpenRead($_.FullName)
            try {
              $reader=[IO.BinaryReader]::new($stream)
              if($reader.ReadUInt16() -ne 0x5a4d){throw "Invalid PE file: $($_.Name)"}
              $stream.Position=60
              $stream.Position=$reader.ReadUInt32()
              if($reader.ReadUInt32() -ne 0x4550){throw "Invalid PE signature: $($_.Name)"}
              $actual=$reader.ReadUInt16()
            } finally {$stream.Dispose()}
            Write-Host ("Redistributable {0}: machine 0x{1:x4}" -f $_.Name,$actual)
            if($actual -eq $machine -or ($arch -eq 'arm64' -and $actual -eq 0xa64e)){
              Copy-Item $_.FullName $out
              Copy-Item $_.FullName "$out/tools"
            }
          }
          New-Item -ItemType Directory -Force "$out/licenses/vcpkg" | Out-Null
          Get-ChildItem "$ports/$triplet/share" -Directory | ForEach-Object {
            $license=Join-Path $_.FullName 'copyright'
            if(Test-Path $license){Copy-Item $license "$out/licenses/vcpkg/$($_.Name).txt"}
          }
      - name: Test actual decoders and architecture
        run: python native/cpp/scripts/native_readers_test.py artifacts/readers-${{ matrix.arch }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: WinArchiveFSPro-native-readers-${{ matrix.arch }}
          path: artifacts/readers-${{ matrix.arch }}
          if-no-files-found: error

      - name: Assemble architecture-native application
        shell: pwsh
        run: ./native/cpp/scripts/package_alternate.ps1 -Architecture ${{ matrix.arch }}
      - name: Verify portable distribution and real filesystem operations
        shell: pwsh
        timeout-minutes: 30
        run: |
          $arch='${{ matrix.arch }}'
          $out="artifacts/dist-$arch"
          $version=([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          ./tests/distribution.ps1 -AppDirectory $out -Version $version
          python -u native/cpp/scripts/windows_integration.py $out
          if($LASTEXITCODE){exit $LASTEXITCODE}
          ./native/cpp/scripts/windows_ui.ps1 -AppDirectory $out -Language en-US
          ./native/cpp/scripts/windows_ui.ps1 -AppDirectory $out -Language zh-CN
      - name: Build and validate architecture-specific NSIS installer
        shell: pwsh
        timeout-minutes: 30
        run: |
          $arch='${{ matrix.arch }}'
          choco install nsis --yes --no-progress
          if($LASTEXITCODE){exit $LASTEXITCODE}
          $nsis=Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'NSIS\makensis.exe'
          $props=([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup
          & $nsis "/DPRODUCT_VERSION=$($props.Version)" "/DWINFSP_MIN_VERSION=$($props.WinFspRuntimeVersion).0" "/DPRODUCT_ARCH=$arch" "/DDIST_DIR=..\artifacts\dist-$arch" installer/WinArchiveFSPro.nsi
          if($LASTEXITCODE){exit $LASTEXITCODE}
          $setup=(Resolve-Path "artifacts/WinArchiveFSPro-Setup-$arch.exe").Path
          $regView=if($arch -eq 'x86'){[Microsoft.Win32.RegistryView]::Registry32}else{[Microsoft.Win32.RegistryView]::Registry64}
          $registry=[Microsoft.Win32.RegistryKey]::OpenBaseKey([Microsoft.Win32.RegistryHive]::LocalMachine,$regView)
          $p=Start-Process $setup -ArgumentList '/S','/LANG=1033' -PassThru -Wait
          if($p.ExitCode -ne 0){throw "Installation failed: $($p.ExitCode)"}
          $key=$registry.OpenSubKey('SOFTWARE\WinArchiveFSPro')
          if(!$key){throw 'Missing installation registry key'}
          $install=$key.GetValue('InstallDir')
          $key.Dispose()
          try {
            if($arch -eq 'arm64'){
              ./tests/distribution.ps1 -AppDirectory "$install/app" -Version $props.Version -ShellEject
              ./tests/association.ps1 -AppDirectory "$install/app"
            }else{
              ./tests/distribution.ps1 -AppDirectory "$install/app" -Version $props.Version
            }
            ./tests/pack-shell.ps1 -AppDirectory "$install/app" -Harness (Resolve-Path build/production/pack-shell.exe).Path
          }finally{
            $p=Start-Process "$install/Uninstall.exe" -ArgumentList '/S' -PassThru -Wait
            if($p.ExitCode -ne 0){throw "Uninstallation failed: $($p.ExitCode)"}
            if($registry.OpenSubKey('SOFTWARE\WinArchiveFSPro')){throw 'Application registry key remains after uninstall'}
            $registry.Dispose()
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WinArchiveFSPro-screenshots-${{ matrix.arch }}
          path: artifacts/screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: WinArchiveFSPro-windows-${{ matrix.arch }}
          path: |
            artifacts/WinArchiveFSPro-Setup-${{ matrix.arch }}.exe
            artifacts/dist-${{ matrix.arch }}/
          if-no-files-found: error
