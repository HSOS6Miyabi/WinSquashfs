[package]
name = "winsqfs-dwarfs"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[dependencies]
dwarfs = { version = "=0.2.1", default-features = false, features = ["zstd", "lzma", "lz4"] }
# Build the XZ decoder statically on Windows.
liblzma = { version = "0.4", features = ["static"] }

[profile.release]
lto = "thin"
panic = "unwind"
